name: probe-gp
on:
  push:
    branches: [probe-gp]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: RIFFFORGE_SKIP_DRUM_DOWNLOAD=1 npm install
      - name: Probe 2
        run: |
          for f in guitarpro7/drum-tabs.gp guitarpro7/tuplets.gp guitarpro7/time-signatures.gp guitarpro8/beat-tempo-change.gp guitarpro7/repeat-close-alternate-endings.gp; do curl -sSfL -o "$(basename $f)" "https://raw.githubusercontent.com/CoderLine/alphaTab/main/packages/alphatab/test-data/$f"; done
          cat > p2.mjs <<'JS'
          import * as at from '@coderline/alphatab';
          import fs from 'node:fs';
          const settings = new at.Settings();
          const load = (f) => at.importer.ScoreLoader.loadScoreFromBytes(new Uint8Array(fs.readFileSync(f)), settings);
          // 1. GP drum articulations
          const drums = load('drum-tabs.gp');
          const arts = drums.tracks[0].percussionArticulations;
          console.log('ARTICULATIONS', arts.length);
          for (const a of arts) console.log('ART', JSON.stringify(a));
          console.log('MusicFontSymbol keys sample:', Object.keys(at.model.MusicFontSymbol ?? {}).filter((k) => /Notehead|Pict|Cymbal|Open|Closed|Stem/.test(k)).slice(0, 60).join(' '));
          console.log('model exports:', Object.keys(at.model).sort().join(' '));
          // 2. alphaTex tie syntax + multi-track
          for (const tex of ['\\title "t" .\n\\track "A"\n\\staff {tabs}\n\\tuning E4 B3 G3 D3 A2 E2\n3.3.4 -.3.4 r.2 |\n\\track "B"\n\\staff {tabs}\n\\tuning G2 D2 A1 E1\n0.4.1',
                             '3.3.4 3.3{t}.4 r.2', '\\track "Drums" \\instrument percussion\n36.4 38.4 42.4 49.4']) {
            try { const sc = at.importer.ScoreLoader.loadAlphaTex(tex, settings);
              for (const t of sc.tracks) { const b = t.staves[0].bars[0].voices[0].beats; console.log('TEX', JSON.stringify(tex.slice(0, 30)), '| track', t.name, 'perc', t.staves[0].isPercussion, 'arts', t.percussionArticulations.length, '| notes', b.map((x) => x.notes.map((n) => `f${n.fret}s${n.string}tie${+n.isTieDestination}p${n.percussionArticulation}`).join('+')).join(' ')); }
            } catch (e) { console.log('TEX ERR', JSON.stringify(tex.slice(0, 30)), e.message.slice(0, 200)); }
          }
          // 3. Build a score by hand (guitar + drums), export GP7, re-import
          const m = at.model;
          const score = new m.Score(); score.title = 'Probe'; score.artist = 'RF';
          for (let i = 0; i < 2; i++) { const mb = new m.MasterBar(); mb.timeSignatureNumerator = 4; mb.timeSignatureDenominator = 4; if (i === 0) mb.tempoAutomations.push(m.Automation.buildTempoAutomation(false, 0, 140, 2)); score.addMasterBar(mb); }
          const g = new m.Track(); g.name = 'Gtr'; g.playbackInfo.program = 30; g.playbackInfo.primaryChannel = 0; g.playbackInfo.secondaryChannel = 1;
          const gs = new m.Staff(); gs.stringTuning = new m.Tuning('Drop D', [64, 59, 55, 50, 45, 38], false); gs.showTablature = true; gs.showStandardNotation = true; g.addStaff(gs); score.addTrack(g);
          const d = new m.Track(); d.name = 'Drums'; d.playbackInfo.primaryChannel = 9; d.playbackInfo.secondaryChannel = 9;
          const ds = new m.Staff(); ds.isPercussion = true; ds.showTablature = false; ds.showStandardNotation = true; d.addStaff(ds); score.addTrack(d);
          const kickArt = arts.find((a) => a.outputMidiNumber === 36) ?? arts[0];
          const kickIdx = d.getOrRegisterPercussionArticulation(kickArt);
          for (let i = 0; i < 2; i++) {
            const gb = new m.Bar(); gs.addBar(gb); const gv = new m.Voice(); gb.addVoice(gv);
            for (let k = 0; k < 4; k++) { const bt = new m.Beat(); bt.duration = 4; const n = new m.Note(); n.fret = k; n.string = 1; if (k === 1) n.isPalmMute = true; if (k === 2) n.isTieDestination = true; bt.addNote(n); gv.addBeat(bt); }
            const db = new m.Bar(); ds.addBar(db); const dv = new m.Voice(); db.addVoice(dv);
            for (let k = 0; k < 4; k++) { const bt = new m.Beat(); bt.duration = 4; const n = new m.Note(); n.percussionArticulation = kickIdx; bt.addNote(n); dv.addBeat(bt); }
          }
          score.finish(settings);
          const bytes = new at.exporter.Gp7Exporter().export(score, settings);
          console.log('EXPORTED bytes', bytes.length);
          fs.writeFileSync('probe-out.gp', bytes);
          const back = load('probe-out.gp');
          console.log('REIMPORT', back.title, back.tempo, back.tracks.map((t) => `${t.name}:perc${t.staves[0].isPercussion}:tun[${t.staves[0].tuning}]:prog${t.playbackInfo.program}:arts${t.percussionArticulations.length}`).join(' | '));
          for (const t of back.tracks) console.log('  ', t.name, t.staves[0].bars[0].voices[0].beats.map((b) => b.notes.map((n) => `f${n.fret}s${n.string}pm${+n.isPalmMute}tie${+n.isTieDestination}p${n.percussionArticulation}->${n.isPercussion ? t.percussionArticulations[n.percussionArticulation]?.outputMidiNumber : ''}`).join('+')).join(' '));
          // 4. repeats / tempo / tuplets structure
          for (const f of ['repeat-close-alternate-endings.gp', 'beat-tempo-change.gp', 'tuplets.gp', 'time-signatures.gp']) {
            const sc = load(f); console.log('FILE', f, 'tempo', sc.tempo);
            for (const mb of sc.masterBars) console.log('  mb', mb.index, `ts=${mb.timeSignatureNumerator}/${mb.timeSignatureDenominator}`, `rs=${mb.isRepeatStart} rc=${mb.repeatCount} alt=${mb.alternateEndings}`, 'tempos=' + mb.tempoAutomations.map((a) => `${a.value}@${a.ratioPosition}`).join(','),
              'beats=' + sc.tracks[0].staves[0].bars[mb.index].voices[0].beats.map((b) => `${b.duration}${b.dots ? '.' : ''}${b.hasTuplet ? 't' + b.tupletNumerator + ':' + b.tupletDenominator : ''}`).join(' '));
          }
          console.log('DynamicValue', JSON.stringify(at.model.DynamicValue));
          JS
          node p2.mjs 2>&1 | head -300
