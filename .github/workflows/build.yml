name: Build Windows & Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Type-check & web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (also downloads the recorded drum kit)
        run: npm install
      - name: tsc -b && vite build
        run: npm run build

      - name: Smoke test - tablature renders under the app's CSP (headless Chromium)
        run: |
          echo "Font files in dist:"; find dist -iname '*bravura*' -o -iname '*.woff*' -o -iname '*.otf' | head -20
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node scripts/ci-smoke-test.mjs nonce ci-smoke-nonce.png
          node scripts/ci-smoke-test.mjs fixed ci-smoke-fixed.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: ci-smoke-*.png

  windows:
    name: Windows (.exe / .msi)
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (also downloads the recorded drum kit)
        run: npm install

      - name: Build Windows installers
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: RiffForge-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: Android (.apk)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners ship the Android SDK, build-tools and NDK (ANDROID_HOME is already set).
      - name: Use the preinstalled Android SDK + NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/build-tools" | tail -3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (also downloads the recorded drum kit)
        run: npm install

      - name: Generate Android project (+ microphone permission, icons)
        run: |
          npx tauri android init --ci
          node scripts/android-permissions.mjs
          npx tauri icon ./app-icon.png

      - name: Build release APK
        run: npx tauri android build --apk

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          echo "Unsigned APK: $UNSIGNED"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"
            echo "Signing with the repository keystore (ANDROID_KEYSTORE_BASE64)."
          else
            PASS="riffforge-ci"
            keytool -genkeypair -v -keystore release.jks -storepass "$PASS" -keypass "$PASS" \
              -alias riffforge -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=RiffForge Studio, O=RiffForge, C=BE"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set - signed with a one-off key. Uninstall the old app before installing a new build, or add the secret for in-place updates."
          fi
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out RiffForge-Studio.apk aligned.apk
          "$BT/apksigner" verify --print-certs RiffForge-Studio.apk
          rm -f release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: RiffForge-Android
          path: RiffForge-Studio.apk
          if-no-files-found: error

  # Every push to main (and every v* tag) publishes a GitHub Release with the .exe, .msi and .apk attached,
  # so the newest build is always at https://github.com/<owner>/<repo>/releases/latest
  release:
    name: GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List release files
        run: find dist -type f -exec ls -la {} \;
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('RiffForge Studio {0}', github.ref_name) || format('RiffForge Studio build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/RiffForge-Windows/**/*.exe
            dist/RiffForge-Windows/**/*.msi
            dist/RiffForge-Android/*.apk
          fail_on_unmatched_files: true
          body: |
            **Windows:** download the `_x64-setup.exe` installer (or the `.msi`) and run it.
            Windows may show a SmartScreen warning because the app isn't code-signed: choose *More info → Run anyway*.

            **Android:** download `RiffForge-Studio.apk` on your phone, open it and allow *Install unknown apps* for your browser/files app when asked.
            This build is signed with a one-off key, so uninstall the previous RiffForge before installing a newer build.

            Built from ${{ github.sha }}.
